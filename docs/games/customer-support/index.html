<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Customer Support WebPort</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<style>
		body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; display: flex; justify-content: center; align-items: center; background-color: #1f1f20; }
		canvas { width: 100%; height: 100%; max-width: 960px; max-height: 540px; background: #1f1f20; }
		#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1f1f20; color: #fff; font-family: system-ui, sans-serif; gap: 8px; z-index: 20; }
		#loading-bar { width: 260px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
		#loading-fill { height: 100%; width: 0%; background: #38bdf8; }
	</style>
</head>
<body>
	<div id="loading">
		<div style="font-weight: 700; color: #38bdf8;">CUSTOMER SUPPORT</div>
		<div id="loading-txt" style="font-size: 13px; color: #94a3b8;">Loading game resources...</div>
		<div id="loading-bar"><div id="loading-fill"></div></div>
	</div>
	<canvas id="unity-canvas" tabindex="-1"></canvas>

	<script src="https://cdn.jsdelivr.net/gh/shayderrr/portsv4@b262cde76d7bb7adf9d47a3a962cb0cede17f7b4/CustomerSupport/Build/CustomerSupportPort.loader.js"></script>
	<script>
		const BASE_URL = "https://cdn.jsdelivr.net/gh/shayderrr/portsv4@b262cde76d7bb7adf9d47a3a962cb0cede17f7b4/CustomerSupport/Build/";
		async function fetchAndMerge(fileParts) {
			const blobs = await Promise.all(fileParts.map(part => fetch(BASE_URL + part).then(res => {
				if (!res.ok) throw new Error("Failed to load part: " + part);
				return res.blob();
			})));
			return URL.createObjectURL(new Blob(blobs));
		}
		(async () => {
			try {
				const dataParts = ["CustomerSupportPort.data.part1", "CustomerSupportPort.data.part2"];
				const wasmParts = ["CustomerSupportPort.wasm.part1", "CustomerSupportPort.wasm.part2"];
				const [mergedDataUrl, mergedWasmUrl] = await Promise.all([fetchAndMerge(dataParts), fetchAndMerge(wasmParts)]);
				
				createUnityInstance(document.querySelector("#unity-canvas"), {
					arguments: [],
					dataUrl: mergedDataUrl,
					frameworkUrl: BASE_URL + "CustomerSupportPort.framework.js",
					codeUrl: mergedWasmUrl,
					streamingAssetsUrl: "StreamingAssets",
					companyName: "DefaultCompany",
					productName: "ExportedProject",
					productVersion: "1.0"
				}, (progress) => {
					const fill = document.getElementById("loading-fill");
					if (fill) fill.style.width = Math.round(progress * 100) + "%";
				}).then(() => {
					const loading = document.getElementById("loading");
					if (loading) loading.remove();
				}).catch(e => {
					console.error("Unity mount error:", e);
				});
			} catch(e) {
				console.error("Customer Support load error:", e);
			}
		})();
	</script>
</body>
</html>
