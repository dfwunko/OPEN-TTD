<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/clover-pit@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CloverPit</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0c10; }
      #unity-container { width: 100%; height: 100%; position: absolute; inset: 0; }
      #unity-canvas { width: 100% !important; height: 100% !important; display: block; }
      #loading-text { color: #10b981; font-size: 24px; font-family: system-ui, sans-serif; font-weight: 700; text-align: center; position: absolute; top: 40%; left: 0; right: 0; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING CLOVERPIT...</div>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var loadingText = document.querySelector("#loading-text");
      let totalBytes = 0;
      let loadedBytes = 0;
      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
          let mbTotal = "86.96";
          if (loadingText) loadingText.textContent = `LOADING CLOVERPIT... ${mbDone} MB / ${mbTotal} MB`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }
      async function mergeFiles(fileParts, cacheKey) {
        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers);
        return URL.createObjectURL(mergedBlob);
      }
      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }
      (async () => {
        try {
          const [dataUrl, wasmUrl] = await Promise.all([
            mergeFiles(getParts("Build/CloverPit.data", 1, 3), "CloverPit.data"),
            mergeFiles(getParts("Build/CloverPit.wasm", 1, 3), "CloverPit.wasm")
          ]);
          var container = document.querySelector("#unity-container");
          var canvas = document.querySelector("#unity-canvas");
          var loadingBar = document.querySelector("#unity-loading-bar");
          var progressBarFull = document.querySelector("#unity-progress-bar-full");
          var warningBanner = document.querySelector("#unity-warning");
          function unityShowBanner(msg, type) {}
          var buildUrl = "Build";
          var loaderUrl = buildUrl + "/CloverPit.loader.js";
          var config = {
            arguments: [],
            dataUrl: dataUrl,
            frameworkUrl: buildUrl + "/CloverPit.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Panik Arcade",
            productName: "CloverPit",
            productVersion: "1.3",
            showBanner: unityShowBanner
          };
          if (loadingBar) loadingBar.style.display = "block";
          var script = document.createElement("script");
          script.src = loaderUrl;
          script.onload = () => {
            createUnityInstance(canvas, config, progress => {
              if (progressBarFull) progressBarFull.style.width = 100 * progress + "%";
            }).then(unityInstance => {
              if (loadingBar) loadingBar.style.display = "none";
              if (loadingText) loadingText.remove();
            }).catch(message => {
              console.error("CloverPit init error:", message);
            });
          };
          document.body.appendChild(script);
        } catch(err) {
          console.error("CloverPit load error:", err);
        }
      })();
    </script>
  </body>
</html>
