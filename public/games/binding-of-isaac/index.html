<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <title>The Binding of Isaac: Wrath of the Lamb</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #player, ruffle-player {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="player"></div>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        autoplay: "on",
        unmuteOverlay: "hidden",
        letterbox: "on"
      };

      window.addEventListener("DOMContentLoaded", () => {
        try {
          const ruffle = window.RufflePlayer.newest();
          const player = ruffle.createPlayer();
          const container = document.getElementById("player");
          container.appendChild(player);
          player.style.width = "100%";
          player.style.height = "100%";
          player.load({
            url: "https://rawcdn.githack.com/bubbls/ugss/3eb957d7d5b10de8e9cba751f6a792ca2c355322/tboiwotl-v1.666.swf",
            allowScriptAccess: true
          });
        } catch(e) {
          console.error("Ruffle init error:", e);
          document.getElementById("player").innerHTML = '<embed src="https://rawcdn.githack.com/bubbls/ugss/3eb957d7d5b10de8e9cba751f6a792ca2c355322/tboiwotl-v1.666.swf" width="100%" height="100%" />';
        }
      });
    </script>
</body>
</html>
