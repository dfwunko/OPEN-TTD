<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Plague Inc</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06080e;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #unity-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #06080e;
      color: white;
    }
    #bar {
      width: 280px;
      max-width: 80%;
      height: 10px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    #fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.15s ease;
    }
    .notice {
      color: #94a3b8;
      font-size: 13px;
      max-width: 380px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div style="font-size: 20px; font-weight: 700; color: #10b981; letter-spacing: -0.02em;">Plague Inc</div>
    <div id="text" style="font-size: 13px; color: #cbd5e1; font-family: monospace;">0 MB / 300 MB</div>
    <div id="bar">
      <div id="fill"></div>
    </div>
    <div class="notice">Initializing global pathogen simulation engine...</div>
  </div>

  <canvas id="unity-canvas"></canvas>

  <script src="./Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js" onerror="handleLoaderError()"></script>
  <script>
    function handleLoaderError() {
      const loader = document.getElementById("loader");
      if (loader) {
        loader.innerHTML = `
          <div style="padding: 24px; max-width: 440px; text-align: center; background: #0d111c; border: 1px solid rgba(16,185,129,0.3); border-radius: 16px;">
            <div style="font-size: 28px; margin-bottom: 8px;">🧬</div>
            <h2 style="font-size: 18px; margin-bottom: 8px; color: #fff;">Plague Inc Simulation</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5;">This game engine requires local game assets. Connect to an online mirror or play directly.</p>
            <button onclick="window.location.reload()" style="background: #10b981; color: #000; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;">Retry Engine</button>
          </div>
        `;
      }
    }

    const baseBuild = "./Build/";
    const base = "./";
    let loaded = 0;
    let totalGuess = 332398592;

    function update() {
      const mb = (loaded / 1024 / 1024).toFixed(2);
      const total = (totalGuess / 1024 / 1024).toFixed(2);
      const textEl = document.getElementById("text");
      const fillEl = document.getElementById("fill");
      if (textEl) textEl.textContent = mb + " MB / " + total + " MB";
      if (fillEl) fillEl.style.width = (loaded / totalGuess * 100) + "%";
    }

    async function fetchPart(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Failed to load local asset: " + url);
      const buf = await res.arrayBuffer();
      loaded += buf.byteLength;
      update();
      return new Uint8Array(buf);
    }

    const files = [
      { name: "6b69ec426bff8a6bd4e760a1d5f507b9.wasm", parts: 2 },
      { name: "3719aa6c33bf126ed64864ee5fc2fafc.data", parts: 15 }
    ];

    function buildUrls(file) {
      const urls = [];
      for (let i = 0; i < file.parts; i++) {
        urls.push(baseBuild + file.name + ".part" + String(i).padStart(2, "0"));
      }
      return urls;
    }

    async function loadFile(file) {
      const urls = buildUrls(file);
      const buffers = await Promise.all(urls.map(fetchPart));
      let size = 0;
      for (const b of buffers) size += b.byteLength;
      const out = new Uint8Array(size);
      let off = 0;
      for (const b of buffers) {
        out.set(b, off);
        off += b.byteLength;
      }
      return out.buffer;
    }

    async function start() {
      try {
        if (typeof createUnityInstance === "undefined") return;
        const wasmFile = files[0];
        const dataFile = files[1];
        const [wasm, data] = await Promise.all([loadFile(wasmFile), loadFile(dataFile)]);
        const wasmUrl = URL.createObjectURL(new Blob([wasm], { type: "application/wasm" }));
        const dataUrl = URL.createObjectURL(new Blob([data]));
        document.getElementById("loader").style.display = "none";
        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: dataUrl,
          frameworkUrl: baseBuild + "b4b58f3ff6d98fbfb83482e25e0e9a5c.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: base + "StreamingAssets",
          companyName: "Ndemic Creations",
          productName: "Plague Inc",
          productVersion: "1.18.3.2"
        });
      } catch(e) {
        console.warn("Plague Inc local assets:", e);
        handleLoaderError();
      }
    }

    if (typeof createUnityInstance !== "undefined") {
      start();
    }
  </script>
</body>
</html>
