<!doctype html>
<html lang="en">
	<base href="https://cdn.jsdelivr.net/gh/web-ports/terraria@main/">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="./app.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Terraria (Terrarium)</title>
		<style>
			body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
			#game-container, canvas, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; }
			#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0e17; color: #fff; font-family: system-ui, sans-serif; gap: 8px; z-index: 100; }
		</style>
		<script type="module" crossorigin src="main.js"></script>
	</head>

	<body>
		<div id="loading">
			<div style="font-size: 20px; font-weight: 700; color: #10b981;">TERRARIA (TERRARIUM)</div>
			<div style="font-size: 13px; color: #94a3b8;">Initializing WebAssembly engine...</div>
		</div>
		<div id="app"></div>
		<canvas id="canvas" style="width: 100%; height: 100%;"></canvas>
		<script>
			window.addEventListener("load", () => {
				setTimeout(() => {
					const l = document.getElementById("loading");
					if (l) l.style.display = "none";
				}, 3000);
			});
		</script>
	</body>
</html>
