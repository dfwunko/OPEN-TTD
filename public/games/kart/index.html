<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kart Bros 3D - Unblocked Kart Racing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #050505;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* HUD Overlays */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 24px;
      z-index: 10;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-box {
      background: rgba(10, 10, 10, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      font-weight: 700;
    }
    .hud-val {
      font-size: 28px;
      font-weight: 900;
      font-family: monospace;
      color: #fff;
      line-height: 1.1;
    }
    .position-1st { color: #f59e0b; text-shadow: 0 0 12px rgba(245, 158, 11, 0.5); }
    .position-2nd { color: #cbd5e1; }
    .position-3rd { color: #b45309; }
    .position-4th { color: #ef4444; }

    .item-box-slot {
      width: 64px;
      height: 64px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
      position: relative;
    }
    .item-box-slot.active {
      animation: pulseSlot 1s infinite alternate;
    }
    @keyframes pulseSlot {
      0% { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
      100% { border-color: #f43f5e; box-shadow: 0 0 24px rgba(244, 63, 94, 0.8); }
    }

    /* Speedometer & Mini map */
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    #minimap-canvas {
      width: 140px;
      height: 140px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    .speed-dial {
      text-align: right;
    }
    .speed-number {
      font-size: 42px;
      font-weight: 900;
      font-family: monospace;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }
    .boost-bar-bg {
      width: 140px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .boost-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      transition: width 0.1s linear;
    }

    /* Start / Finish / Countdown Banner */
    #banner-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    .banner-title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .banner-sub {
      font-size: 14px;
      color: #94a3b8;
      max-width: 420px;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-start {
      padding: 14px 36px;
      font-size: 18px;
      font-weight: 800;
      color: #000;
      background: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-start:hover {
      transform: scale(1.05);
      background: #38bdf8;
      color: #fff;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
    }

    #countdown-text {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 110px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 40px #38bdf8;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="countdown-text">3</div>

    <!-- HUD Overlay -->
    <div id="hud">
      <div class="hud-top">
        <div class="hud-box">
          <span class="hud-label">POSITION</span>
          <span id="hud-pos" class="hud-val position-1st">1ST</span>
        </div>

        <div class="item-box-slot" id="hud-item" title="Press [E] or [Ctrl] to use item">
          <span id="hud-item-icon">❓</span>
        </div>

        <div class="hud-box">
          <span class="hud-label">LAP</span>
          <span id="hud-lap" class="hud-val">1/3</span>
        </div>
      </div>

      <div class="hud-bottom">
        <canvas id="minimap-canvas" width="140" height="140"></canvas>
        <div class="speed-dial">
          <div id="hud-speed" class="speed-number">0 <span style="font-size: 16px; color: #64748b;">KM/H</span></div>
          <div class="boost-bar-bg">
            <div id="hud-boost-fill" class="boost-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Banner Overlay -->
    <div id="banner-overlay">
      <div class="banner-title">KART BROS 3D</div>
      <div class="banner-sub">
        High-speed 3D Kart Championship! Drift around sharp corners, pick up item boxes, and blast past rival drivers!
      </div>
      <button class="btn-start" id="start-btn">RACE NOW</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playEngine(freq = 120) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playBoost() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      }
      playItem() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659, this.ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    }
    const sound = new SoundFX();

    // Scene Setup
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e1a);
    scene.fog = new THREE.FogExp2(0x0a0e1a, 0.003);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 200, 100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Track Geometry Generation (Oval Circuit with S-curve)
    const trackPoints = [];
    const numPoints = 60;
    const R = 180;
    for (let i = 0; i < numPoints; i++) {
      const angle = (i / numPoints) * Math.PI * 2;
      let x = Math.cos(angle) * R * 1.4;
      let z = Math.sin(angle) * R;
      // Add winding curve
      if (i > 15 && i < 35) {
        x += Math.sin(angle * 3) * 45;
      }
      trackPoints.push(new THREE.Vector3(x, 0, z));
    }
    const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true);

    // Render Track Surface
    const trackWidth = 24;
    const trackGeo = new THREE.TubeGeometry(trackCurve, 300, trackWidth / 2, 8, true);
    const trackMat = new THREE.MeshStandardMaterial({
      color: 0x22252a,
      roughness: 0.8,
      metalness: 0.1
    });
    const trackMesh = new THREE.Mesh(trackGeo, trackMat);
    trackMesh.scale.set(1, 0.02, 1); // Flatten tube into wide track ribbon
    trackMesh.position.y = -0.2;
    scene.add(trackMesh);

    // Grass Terrain
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111e16, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.5;
    scene.add(ground);

    // Start / Finish Line Banner
    const startPos = trackCurve.getPointAt(0);
    const startTangent = trackCurve.getTangentAt(0);
    const bannerGeo = new THREE.BoxGeometry(trackWidth, 10, 1);
    const bannerMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2 });
    const bannerMesh = new THREE.Mesh(bannerGeo, bannerMat);
    bannerMesh.position.copy(startPos);
    bannerMesh.position.y = 5;
    bannerMesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), startTangent);
    scene.add(bannerMesh);

    // Item Boxes
    const itemBoxes = [];
    const itemBoxGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
    const itemBoxMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2, metalness: 0.8 });
    for (let i = 1; i <= 8; i++) {
      const p = trackCurve.getPointAt(i / 9);
      const box = new THREE.Mesh(itemBoxGeo, itemBoxMat);
      box.position.copy(p);
      box.position.y = 2;
      scene.add(box);
      itemBoxes.push({ mesh: box, active: true, respawnTimer: 0 });
    }

    // Kart Builder Helper
    function createKartMesh(colorHex) {
      const group = new THREE.Group();
      
      // Chassis
      const bodyGeo = new THREE.BoxGeometry(3, 1.2, 5);
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.5 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1;
      group.add(body);

      // Driver Helmet
      const headGeo = new THREE.SphereGeometry(0.8, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0, 2, -0.5);
      group.add(head);

      // Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.6, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
      
      const wheelPositions = [
        [-1.8, 0.7, 1.8], [1.8, 0.7, 1.8],
        [-1.8, 0.7, -1.8], [1.8, 0.7, -1.8]
      ];
      wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(...pos);
        group.add(wheel);
      });

      return group;
    }

    // Player & AI Karts Setup
    const playerMatColor = 0x38bdf8;
    const playerGroup = createKartMesh(playerMatColor);
    scene.add(playerGroup);

    const player = {
      group: playerGroup,
      posProgress: 0,
      speed: 0,
      maxSpeed: 1.4,
      accel: 0.02,
      driftBoost: 0,
      angle: 0,
      lap: 1,
      item: null,
      rank: 1
    };

    const aiColors = [0xef4444, 0x10b981, 0xf59e0b];
    const aiKarts = aiColors.map((color, idx) => {
      const group = createKartMesh(color);
      scene.add(group);
      return {
        group,
        posProgress: (idx + 1) * 0.02,
        speed: 0.8 + Math.random() * 0.2,
        baseSpeed: 0.95 + idx * 0.05,
        lap: 1,
        angle: 0
      };
    });

    // Inputs
    const keys = { w: false, a: false, s: false, d: false, shift: false, e: false };
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 's' || e.key === 'ArrowDown') keys.s = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.key === 'Shift' || e.key === ' ') keys.shift = true;
      if (k === 'e' || e.key === 'Control') usePlayerItem();
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 's' || e.key === 'ArrowDown') keys.s = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
      if (e.key === 'Shift' || e.key === ' ') keys.shift = false;
    });

    // Item Usage
    function usePlayerItem() {
      if (!player.item) return;
      if (player.item === 'BOOST') {
        player.speed = player.maxSpeed * 1.8;
        sound.playBoost();
      }
      player.item = null;
      document.getElementById('hud-item-icon').innerText = '❓';
      document.getElementById('hud-item').classList.remove('active');
    }

    // Race State Management
    let raceStarted = false;
    document.getElementById('start-btn').addEventListener('click', () => {
      sound.init();
      document.getElementById('banner-overlay').style.display = 'none';
      startCountdown();
    });

    function startCountdown() {
      const countEl = document.getElementById('countdown-text');
      let count = 3;
      countEl.style.opacity = '1';
      countEl.innerText = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countEl.innerText = count;
        } else if (count === 0) {
          countEl.innerText = 'GO!';
          raceStarted = true;
        } else {
          clearInterval(timer);
          countEl.style.opacity = '0';
        }
      }, 900);
    }

    // Minimap Render
    const minimapCanvas = document.getElementById('minimap-canvas');
    const minimapCtx = minimapCanvas.getContext('2d');

    function drawMinimap() {
      minimapCtx.clearRect(0, 0, 140, 140);
      minimapCtx.save();
      minimapCtx.translate(70, 70);
      minimapCtx.scale(0.3, 0.3);

      // Track line
      minimapCtx.beginPath();
      trackPoints.forEach((p, i) => {
        if (i === 0) minimapCtx.moveTo(p.x, p.z);
        else minimapCtx.lineTo(p.x, p.z);
      });
      minimapCtx.closePath();
      minimapCtx.strokeStyle = '#334155';
      minimapCtx.lineWidth = 16;
      minimapCtx.stroke();

      // AI dots
      aiKarts.forEach(ai => {
        minimapCtx.fillStyle = '#ef4444';
        minimapCtx.beginPath();
        minimapCtx.arc(ai.group.position.x, ai.group.position.z, 10, 0, Math.PI * 2);
        minimapCtx.fill();
      });

      // Player dot
      minimapCtx.fillStyle = '#38bdf8';
      minimapCtx.beginPath();
      minimapCtx.arc(player.group.position.x, player.group.position.z, 12, 0, Math.PI * 2);
      minimapCtx.fill();

      minimapCtx.restore();
    }

    // Main Game Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (raceStarted) {
        // Player Physics
        if (keys.w) {
          player.speed = Math.min(player.speed + player.accel, player.maxSpeed);
          sound.playEngine(100 + player.speed * 120);
        } else if (keys.s) {
          player.speed = Math.max(player.speed - player.accel, -player.maxSpeed * 0.4);
        } else {
          player.speed *= 0.97; // friction
        }

        // Steering & Drift
        let turnSpeed = 0.03;
        if (keys.shift && Math.abs(player.speed) > 0.3) {
          turnSpeed = 0.05; // sharper drift turn
          player.driftBoost = Math.min(player.driftBoost + delta * 2, 1);
          document.getElementById('hud-boost-fill').style.width = (player.driftBoost * 100) + '%';
        } else if (player.driftBoost > 0.5) {
          // Trigger mini boost on drift release
          player.speed = player.maxSpeed * 1.5;
          sound.playBoost();
          player.driftBoost = 0;
          document.getElementById('hud-boost-fill').style.width = '0%';
        } else {
          player.driftBoost = 0;
          document.getElementById('hud-boost-fill').style.width = '0%';
        }

        if (keys.a) player.angle += turnSpeed;
        if (keys.d) player.angle -= turnSpeed;

        // Progress along spline track
        player.posProgress += (player.speed * delta) * 0.012;
        if (player.posProgress >= 1) {
          player.posProgress -= 1;
          player.lap++;
          if (player.lap > 3) player.lap = 3;
          document.getElementById('hud-lap').innerText = `${player.lap}/3`;
        } else if (player.posProgress < 0) {
          player.posProgress += 1;
        }

        // Position player on track with drift offset
        const pPoint = trackCurve.getPointAt(player.posProgress % 1);
        const pTangent = trackCurve.getTangentAt(player.posProgress % 1);
        
        player.group.position.copy(pPoint);
        player.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), pTangent);
        player.group.rotation.y += player.angle;

        // AI Karts Update
        aiKarts.forEach(ai => {
          ai.posProgress += (ai.speed * delta) * 0.012;
          if (ai.posProgress >= 1) {
            ai.posProgress -= 1;
            ai.lap++;
          }
          const aiPoint = trackCurve.getPointAt(ai.posProgress % 1);
          const aiTangent = trackCurve.getTangentAt(ai.posProgress % 1);
          ai.group.position.copy(aiPoint);
          ai.group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), aiTangent);
        });

        // Item Box Pickup Check
        itemBoxes.forEach(box => {
          box.mesh.rotation.y += delta * 2;
          if (box.active && player.group.position.distanceTo(box.mesh.position) < 5) {
            box.active = false;
            box.mesh.visible = false;
            box.respawnTimer = 5;
            player.item = 'BOOST';
            sound.playItem();
            document.getElementById('hud-item-icon').innerText = '🚀';
            document.getElementById('hud-item').classList.add('active');
          }
          if (!box.active) {
            box.respawnTimer -= delta;
            if (box.respawnTimer <= 0) {
              box.active = true;
              box.mesh.visible = true;
            }
          }
        });

        // Position Ranking Calculation
        const allRacers = [
          { isPlayer: true, score: player.lap * 10 + player.posProgress },
          ...aiKarts.map((ai, i) => ({ isPlayer: false, score: ai.lap * 10 + ai.posProgress }))
        ].sort((a, b) => b.score - a.score);

        const playerRank = allRacers.findIndex(r => r.isPlayer) + 1;
        const posText = playerRank === 1 ? '1ST' : playerRank === 2 ? '2ND' : playerRank === 3 ? '3RD' : '4TH';
        const posEl = document.getElementById('hud-pos');
        posEl.innerText = posText;
        posEl.className = `hud-val position-${posText.toLowerCase()}`;

        // HUD Speedometer Update
        const kmh = Math.floor(Math.abs(player.speed) * 90);
        document.getElementById('hud-speed').innerHTML = `${kmh} <span style="font-size: 16px; color: #64748b;">KM/H</span>`;

        // Smooth Camera Follow
        const cameraOffset = new THREE.Vector3(0, 8, -18);
        cameraOffset.applyQuaternion(player.group.quaternion);
        camera.position.copy(player.group.position).add(cameraOffset);
        camera.lookAt(player.group.position.clone().add(new THREE.Vector3(0, 2, 0)));
      }

      drawMinimap();
      renderer.render(scene, camera);
    }
    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
