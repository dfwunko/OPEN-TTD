    <script>
      // Self-heal GitHub Pages base path when accessed without a trailing slash
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <script>
      // Global error listener to display a clear error message if the site fails to load or scripts crash
      (function() {
        function showInitError(message, source, lineno) {
          var root = document.getElementById('root');
          // Only show pre-mount UI if React hasn't rendered into #root yet
          if (root && (!root.children.length || root.dataset.mounted !== 'true')) {
            var existing = document.getElementById('nova-fatal-error');
            if (existing) return;

            var errorDetails = message || 'An unknown error occurred while loading Nova Arcade.';
            if (source) {
              errorDetails += '\nLocation: ' + source + (lineno ? (':' + lineno) : '');
            }

            var banner = document.createElement('div');
            banner.id = 'nova-fatal-error';
            banner.style.cssText = 'position:fixed;inset:0;background:#06080e;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,-apple-system,sans-serif;z-index:9999999;';
            banner.innerHTML = [
              '<div style="max-width:520px;width:100%;background:#0d111c;border:1px solid rgba(239,68,68,0.3);border-radius:16px;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8);text-align:center;">',
                '<div style="width:48px;height:48px;margin:0 auto 16px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;">⚠️</div>',
                '<h2 style="font-size:20px;font-weight:700;margin:0 0 8px;color:#ffffff;letter-spacing:-0.02em;">Nova Arcade Load Error</h2>',
                '<p style="font-size:13px;color:#94a3b8;margin:0 0 16px;line-height:1.5;">The arcade encountered an error while initializing or fetching required files.</p>',
                '<div style="background:#030508;border:1px solid #1e293b;border-radius:10px;padding:12px;margin:0 0 20px;text-align:left;font-family:monospace;font-size:12px;color:#f87171;word-break:break-all;white-space:pre-wrap;max-height:150px;overflow-y:auto;">' + errorDetails + '</div>',
                '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">',
                  '<button onclick="window.location.reload()" style="background:#06b6d4;color:#000;border:none;padding:10px 20px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;">Reload Arcade</button>',
                  '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){};window.location.reload();" style="background:#1e293b;color:#cbd5e1;border:1px solid #334155;padding:10px 18px;border-radius:10px;font-size:13px;cursor:pointer;">Clear Cache & Reload</button>',
                '</div>',
              '</div>'
            ].join('');
            document.body.appendChild(banner);
          }
        }

        window.addEventListener('error', function(event) {
          var msg = event.message;
          var src = event.filename;
          var line = event.lineno;
          if (event.target && event.target.tagName === 'SCRIPT') {
            msg = 'Failed to load script resource: ' + (event.target.src || event.target.href || 'unknown script');
            src = event.target.src;
          }
          showInitError(msg, src, line);
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason);
          showInitError('Unhandled promise rejection: ' + msg);
        });
      })();
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
