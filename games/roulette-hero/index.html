<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Roulette Hero</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/shayderrr/portsv4@f062252f3248db5a493ede8b57e68a29ae96dee3/15819845/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/shayderrr/portsv4@f062252f3248db5a493ede8b57e68a29ae96dee3/15819845/TemplateData/style.css">
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
      #unity-container { width: 100%; height: 100%; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { width: 100% !important; height: 100% !important; display: block; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      const BASE_URL = "https://cdn.jsdelivr.net/gh/shayderrr/portsv4@f062252f3248db5a493ede8b57e68a29ae96dee3/15819845/Build/";
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {}
      async function fetchAndMerge(fileParts) {
        const blobs = await Promise.all(fileParts.map(part => fetch(BASE_URL + part).then(res => {
          if (!res.ok) throw new Error("Failed to load part: " + part);
          return res.blob();
        })));
        return URL.createObjectURL(new Blob(blobs));
      }
      document.querySelector("#unity-loading-bar").style.display = "block";
      (async () => {
        try {
          const dataParts = ["Web.data.br.part1","Web.data.br.part2","Web.data.br.part3","Web.data.br.part4","Web.data.br.part5"];
          const wasmParts = ["Web.wasm.br.part1","Web.wasm.br.part2","Web.wasm.br.part3"];
          const [mergedDataUrl, mergedWasmUrl] = await Promise.all([fetchAndMerge(dataParts), fetchAndMerge(wasmParts)]);
          var config = {
            arguments: [],
            dataUrl: mergedDataUrl,
            frameworkUrl: BASE_URL + "Web.framework.js",
            codeUrl: mergedWasmUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Free Lives",
            productName: "Roulette Hero",
            productVersion: "0.1",
            showBanner: unityShowBanner
          };
          var script = document.createElement("script");
          script.src = BASE_URL + "Web.loader.js";
          script.onload = () => {
            createUnityInstance(canvas, config, progress => {
              document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then(unityInstance => {
              document.querySelector("#unity-loading-bar").style.display = "none";
            }).catch(message => {
              console.warn("Roulette Hero warning:", message);
            });
          };
          document.body.appendChild(script);
        } catch(e) {
          console.error("Asset merging error:", e);
        }
      })();
    </script>
  </body>
</html>
