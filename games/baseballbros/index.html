<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>BASEBALL BROS! | Offline Single Player</title>
	<meta name="description" content="Offline multiplayer baseball! Strikeouts, steals, and grand slams! Hit Nukes!" />
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<meta name="Keywords" content="Baseball, Play, Free, Online, Multiplayer, Games, IO, Sports, Scrolling, Friends">
	<meta name="author" content="Blue Wizard Digital">
	<link rel="manifest" href="manifest.json">

	<script type="text/javascript" src="./BaseballBros.js"></script>

	<script>
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
		window.addEventListener('keydown', function(e) {
			var tag = e.target.tagName;
			if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
				e.preventDefault();
			}
		});
		var aCo = "US";
	</script>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000000;
			color: orange;
			user-select: none;
		}
		#game2 {
			width: 100%;
			height: 100%;
			position: fixed;
			inset: 0;
			overflow: hidden;
		}
		#openfl-content {
			background: #000000;
			width: 100%;
			height: 100%;
		}
		#openfl-content canvas {
			display: block;
			width: 100% !important;
			height: 100% !important;
			object-fit: contain;
		}
		#loading {
			position: absolute;
			z-index: 15;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: rgba(0, 0, 0, 0.85);
			padding: 24px;
			border-radius: 12px;
			text-align: center;
			transition: opacity 0.3s ease;
		}
		#more, footer {
			display: none !important;
		}
	</style>

	<script>
        /* OFFLINE FIREBASE STUBS - Reroutes cloud saves to local storage */
		var userData = "";

		function triggerSignIn() {
			console.log('Offline Mode: Sign in disabled.');
		}

		function saveGameData(gameDataValue) {
			console.log('Offline: saving gameData locally');
			userData = gameDataValue;
            localStorage.setItem('bbros_offline_save', gameDataValue);
		}

		function loadGameData() { return userData; }

		function loadGameDataAsync() {
            var localSave = localStorage.getItem('bbros_offline_save');
            if(localSave) {
                userData = localSave;
            }
            if (typeof Main != "undefined") {
                Main.LoadDataComplete();
            }
		}

		function signOut() {}

		function isUserLoggedIn() {
			return false; // Forces guest/offline play
		}

        // Auto-load local data on boot
        window.addEventListener('load', loadGameDataAsync);
	</script>
</head>
<body style="overflow:hidden;">

    <div id="loading">
		<center>
			<img src="assets/loading4.png" alt="Loading" onerror="this.style.display='none'"><br/><br/>
			<img src="assets/fbro.png" onerror="this.style.display='none'">
			<img src="assets/bbbro.png" onerror="this.style.display='none'">
			<img src="assets/sbro.png" onerror="this.style.display='none'">
			<img src="assets/wbro.png" onerror="this.style.display='none'">
			<img src="assets/kbro.png" onerror="this.style.display='none'">
			<img src="assets/bbro.png" onerror="this.style.display='none'">
			<p style="font-family: sans-serif; font-size: 13px; color: #ffa500; margin-top: 10px; font-weight: bold;">Loading Baseball Bros...</p>
		</center>
	</div>

    <div id="game2">
		<div id="openfl-content" onblur="window.focus();">
			<script type="text/javascript">
				lime.embed ("BaseballBros", "openfl-content", 0, 0, { parameters: {} });
			</script>
		</div>
	</div>

	<script>
        /* OFFLINE AD & ENGINE STUBS - Prevents the game engine from crashing */
		function ShowAdBreak() {
            console.log("Offline: Interstitial Ad Skipped.");
            if (typeof Main !== 'undefined' && typeof Main.DoneInterstitialAd === 'function') {
                setTimeout(function() {
                    Main.DoneInterstitialAd(false);
                }, 50);
            }
		}

        function ShowVideo(theUnitName) {
            console.log("Offline: Video Ad Skipped.", theUnitName);
            if (typeof Main !== 'undefined' && typeof Main.DoneVideoAd === 'function') {
                setTimeout(function() {
                    Main.DoneVideoAd();
                }, 50);
            }
        }

        function ShowRewardedAd() {
            console.log("Offline: Rewarded Ad Skipped & Awarded.");
            if (typeof Main !== 'undefined') {
                setTimeout(function() {
                    if (typeof Main.RewardComplete === 'function') {
                        Main.RewardComplete();
                    } else if (typeof Main.DoneVideoAd === 'function') {
                        Main.DoneVideoAd();
                    }
                }, 50);
            }
        }

        function ShowAd1() {}
        function ShowAd2() {}
        function ShowAd3() {}
        function ShowAd4() {}
        function ShowAd6() {}
        function ShowAd7() {}
        function ShowAd8() {}
        function ShowAd9() {}
        function ShowAd10() {}
        function HideAllAds() {
            var el = document.getElementById("loading");
            if (el) el.style.display = "none";
        }
        function HideAd(divName) {
            if (divName) {
                var el = document.getElementById(divName);
                if (el) el.style.display = "none";
            }
        }
        function ShowAdPosition() {}
        function GamePlayStart() {}
        function GamePlayStop() {}
        function HappyTime() {}
        function EmailSignup() {}
        function SendEvent() {}

		// Auto-hide loading screen once canvas is active
		var checkCanvasInterval = setInterval(function () {
			var canvas = document.querySelector("#openfl-content canvas");
			if (canvas && canvas.width > 0 && canvas.height > 0) {
				var loadDiv = document.getElementById("loading");
				if (loadDiv) loadDiv.style.display = "none";
				clearInterval(checkCanvasInterval);
			}
		}, 300);

		setInterval(function () {
			if (document.activeElement && document.activeElement.tagName == "IFRAME") {
				document.activeElement.blur();
				var el = document.getElementById('openfl-content');
				if (el) el.focus();
			}
		}, 30);

		var element = document.getElementById('openfl-content');
		function keepFocus() { if (element) element.focus(); }
		if (element) {
			element.addEventListener('blur', keepFocus);
			element.addEventListener('focusout', keepFocus);
		}
	</script>
</body>
</html>
